aid: prime-roots
name: Prime Roots
description: >-
  Prime Roots is a Berkeley, California foodtech company making koji- and
  plant-based deli meats and bacon marketed as "the clean deli meat" — no
  preservatives, nitrates, or celery salt. It sells direct-to-consumer and
  through foodservice, running its online store on Shopify. That storefront
  exposes a native agent-commerce surface: an llms.txt / agents.md agent guide,
  a Universal Commerce Protocol (UCP, https://ucp.dev) discovery document at
  /.well-known/ucp, and a hosted MCP endpoint at /api/ucp/mcp for agent-driven
  catalog search, cart, and buyer-approved checkout. Added to the API Evangelist
  network as a Prosus Ventures portfolio company and enriched from its live
  public discovery surfaces.
